name: NeriPlayer Website

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh public GitHub metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            node tools/build-github-snapshot.mjs --scheduled
          else
            node tools/build-github-snapshot.mjs
          fi

      # 仅收集公开站点资源，生成工具和仓库文件不进入发布目录
      - name: Collect site files
        if: steps.metadata.outputs.deploy == 'true'
        run: |
          mkdir -p _site
          cp -r index.html 404.html .nojekyll robots.txt site.webmanifest assets en _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi

      - name: Upload artifact
        if: steps.metadata.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        if: steps.metadata.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
